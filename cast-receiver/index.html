          <div class="info">
            <p id="title" class="title"></p>
            <p id="artist" class="artist"></p>
            <p id="album" class="album"></p>
            <div class="progress">
              <div class="bar"><i id="fill"></i></div>
              <div class="times"><span id="now">0:00</span><span id="total">0:00</span></div>
            </div>

              <h2>Up next</h2>
              <ol id="next"></ol>

          </div>
        </div>

        </div>

          <svg class="brand-word" viewBox="0 369 539 106"><use href="#sonor-wordmark" /></svg>
