<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sonor — under construction</title>
    <meta
      name="description"
      content="A music player for Subsonic and Navidrome servers, on macOS, Windows, Linux, iOS and Android. The website is under construction."
    />
    <meta name="theme-color" content="#15141b" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://sonor.fi/" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sonor" />
    <meta property="og:url" content="https://sonor.fi/" />
    <meta property="og:title" content="Sonor — under construction" />
    <meta
      property="og:description"
      content="A music player for Subsonic and Navidrome servers, on macOS, Windows, Linux, iOS and Android."
    />
    <meta property="og:image" content="https://sonor.fi/sonor-social-1280x640.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="The Sonor logo: a treble clef on a staff, in neon pink and lavender, on a dark background." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sonor — under construction" />
    <meta
      name="twitter:description"
      content="A music player for Subsonic and Navidrome servers, on macOS, Windows, Linux, iOS and Android."
    />
    <meta name="twitter:image" content="https://sonor.fi/sonor-social-1280x640.png" />
    <meta name="twitter:image:alt" content="The Sonor logo: a treble clef on a staff, in neon pink and lavender, on a dark background." />

    <style>
      :root {
        color-scheme: dark;
        --ink: #15141b;
        --text: #f4f1ff;
        --muted: #bdb8cc;
        --pink: #f892c3;
        --focus: #c9b8ff;
      }
      * {
        box-sizing: border-box;
      }
      html {
        background: var(--ink);
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(60rem 36rem at 50% -8%, rgb(248 146 195 / 0.14), transparent 70%),
          var(--ink);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        width: 100%;
        max-width: 36rem;
        margin: 0 auto;
        padding: 3rem 16px;
        text-align: center;
      }
      .logo {
        display: block;
        width: min(100%, 26rem);
        height: auto;
      }
      .tagline {
        margin: 0;
        color: var(--muted);
        font-size: 1.125rem;
      }
      .status {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border: 1px solid var(--pink);
        border-radius: 999px;
        color: var(--pink);
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }
      .btn {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border: 2px solid var(--pink);
        border-radius: 0.5rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 150ms ease, color 150ms ease;
      }
      .btn-primary {
        background: var(--pink);
        color: var(--ink);
      }
      .btn-primary:hover {
        background: #ffb0d4;
        border-color: #ffb0d4;
      }
      .btn-secondary {
        color: var(--pink);
      }
      .btn-secondary:hover {
        background: rgb(248 146 195 / 0.12);
      }
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      a {
        color: var(--pink);
      }
      footer {
        padding: 1.5rem 16px;
        color: var(--muted);
        font-size: 0.875rem;
        text-align: center;
      }
      .fade-in {
        animation: fade-in 600ms ease-out both;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fade-in {
          animation: none;
        }
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="logo fade-in"
        src="/sonor-lockup-1000.png"
        srcset="/sonor-lockup-1000.png 1x, /sonor-lockup-2000.png 2x"
        width="1000"
        height="287"
        alt="Sonor"
      />
      <p class="tagline fade-in">
        A music player for Subsonic and Navidrome servers — on macOS, Windows, Linux, iOS and Android.
      </p>
      <p class="status fade-in">
        <span class="badge">Under construction</span>
        <span>The full website is still being built. In the meantime, the app is ready to try.</span>
      </p>
      <nav class="actions fade-in" aria-label="Get Sonor">
        <a class="btn btn-primary" href="https://github.com/sonorhq/sonor/releases">Try the public beta</a>
        <a class="btn btn-secondary" href="https://github.com/sonorhq/sonor/issues">Report a bug</a>
      </nav>
    </main>
    <footer>&copy; 2026 Sonor</footer>
  </body>
</html>
