<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sonor, a music player for Subsonic and Navidrome servers." />
    <title>Sonor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f0f10;
        --fg: #ececee;
        --muted: #9a9aa2;
        --accent: #f4743b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 0 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 36rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        color: var(--accent);
        font-size: 2.5rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.125rem;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sonor</h1>
      <p>
        A music player for Subsonic and Navidrome servers.
        Public beta: <a href="https://github.com/sonorhq/sonor/releases">download from GitHub releases</a>.
      </p>
    </main>
  </body>
</html>
